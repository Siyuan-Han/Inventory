[tool.poetry]
name = "camille-backend"
version = "0.1.0"
description = "Wedding Dress Inventory API"
authors = ["han <camille.han@lombardodier.com>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.9"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.30.0" }
sqlalchemy = { extras = ["asyncio"], version = "^2.0.0" }
asyncpg = "^0.29.0"
python-multipart = "^0.0.9"
python-dotenv = "^1.0.0"
pydantic = "^2.0"
pydantic-settings = "^2.0"
httpx = "^0.27.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
